<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>MalyshevMS github hosted website</title>
    </head>
    <body>
        <form id="calculator" method="post">
            <input type="number" name="num1" id="num1">
            <select name="operation" id="select">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" name="num2" id="num2">
            <input type="submit" name="calculate" value="Calculate">
            <br>
        </form>
        <span id="res">Result:</span>
        <script src="js/main.js"></script>
    </body>
</html>
