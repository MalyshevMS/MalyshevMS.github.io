<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My projects - GitHub</title>
  <meta name="description" content="GitHub projects" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">
            <a href="https://github.com/MalyshevMS">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub Logo" width="30px" height="30px"/>
            </a>
        </div>
        <div>
          <h1>My GitHub projects</h1>
          <p class="lead">A collection of my GitHub projects with a small description and link</p>
        </div>
      </div>

      <div class="controls">
        <input id="search" type="search" placeholder="Search projects..." aria-label="Search projects">
        <div class="tags" id="tags"></div>
      </div>
    </header>

    <main>
      <div class="grid" id="projectsGrid"></div>
    </main>

    <footer>
      Created by <a href="https://github.com/MalyshevMS">MalyshevMS</a> — <span id="year"></span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
